<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts for scripts/og.mjs, which draws its text as SVG through sharp. Without
  this, "the font" was whatever the machine had: Segoe UI on one, Liberation
  Sans on another, so every build on a different machine redrew every share
  image. Archivo lives here, beside its licence (OFL.txt), and og.mjs points
  FONTCONFIG_FILE at this file before sharp loads. The system's own fonts are
  still included, as fallbacks for any character Archivo does not have.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
</fontconfig>
