name: Deploy

# Every push to main goes live. His ruling, 2026-10-19.
#
# Until then deploying was by hand, and everything in the backend that
# publishes — Save in the editors, Rebuild the site, Sync Printful, the daily
# scheduled-post check — commits and assumes the push deploys. It did not, so
# each of them said "about two minutes" and nothing happened until the next
# hand deploy. This is what makes those true.
#
# What it costs: pushing is deploying, from anywhere. Read DEPLOY.md.
#
# Order matters. Lint, tests and the build's own typecheck first, so a broken
# commit is not deployed; then any new D1 migration, so code that reads a new
# column never runs ahead of it; then the deploy.
#
# The build runs WITHOUT the data keys (Steam, RetroAchievements, Printful), so
# what deploys is what is committed: each fetch script keeps the committed
# data/*.json when its key is absent. Fresh data arrives by commit — the
# nightly play-data workflow, or Sync Printful — not by build.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, plus
#                            Account → D1 → Edit for the migrations
#   CLOUDFLARE_ACCOUNT_ID  — not secret, but kept beside the token
# Without the token the checks still run and the deploy is skipped with a
# notice, rather than failing every push.

on:
  push:
    branches: [main]
  # Run by play-data.yml after it commits: a push made with GITHUB_TOKEN does
  # not fire other workflows, but a dispatch does.
  workflow_dispatch: {}

# One deploy at a time, in order. Never cancel one half-way: a deploy cut off
# after its migration and before its upload is the one state worth avoiding.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Whether there is a token, as a yes or no. A step cannot test its own
    # env in its `if`, and the token itself is kept out of every step but the
    # two that use it — npm ci and the tests run code nobody here wrote.
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.13 or newer: the worker tests use node:sqlite.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Worker tests
        run: npm run test:worker

      # Also the typecheck: next build runs TypeScript itself. A separate
      # `npm run typecheck` before it would fail on a fresh checkout, because
      # next-env.d.ts and .next/types are written by the build and ignored by git.
      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply master-roachi --remote

      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: No token, no deploy
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set — checked and built, not deployed."
