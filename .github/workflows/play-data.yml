name: Refresh play data

# The site is a static export, so what is being played is baked in at build
# time. Without this, the "Right now" strip would only update when something
# else happened to trigger a deploy.
#
# This fetches the snapshot daily and commits it if it changed. The commit is
# what triggers the Cloudflare build — no deploy hook or Cloudflare token
# needed, and the data stays visible and versioned in the repo rather than
# appearing from nowhere at build time.
#
# Needs one repository secret: STEAM_API_KEY.
# The SteamID is not secret and is defaulted in the script.

on:
  schedule:
    # 05:10 UTC daily — 07:10 SAST, so an evening's play is reflected by
    # morning. Deliberately not on the hour: GitHub's scheduler is busiest then
    # and delays runs.
    - cron: '10 5 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install step: the script uses only node built-ins and fetch.
      - name: Fetch from Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/steam.mjs

      - name: Fetch from RetroAchievements
        env:
          RETRO_API_KEY: ${{ secrets.RETRO_API_KEY }}
          # Not a secret — a repository variable, so the profile is readable
          # here rather than hidden behind a mask.
          RETRO_USER: ${{ vars.RETRO_USER }}
        run: node scripts/retro.mjs

      - name: Commit if it changed
        run: |
          git config user.name "Master Roachi"
          git config user.email "207052285+MasterRoachi@users.noreply.github.com"
          git add data/steam.json data/retro.json
          if git diff --staged --quiet; then
            echo "nothing changed — no commit, no deploy"
          else
            # The commit message must not contain a CI-skip token. Cloudflare
            # Workers Builds honours those, so tagging the commit would land
            # the data in the repo and then suppress the build that publishes
            # it. The loop such a tag usually guards against cannot happen
            # here anyway: GitHub does not fire workflows for commits pushed
            # with GITHUB_TOKEN.
            #
            # Cloudflare scans the whole message, body included — so mentioning
            # the token, even to explain it, is enough to skip the build.
            git commit -m "Refresh play data"
            git push
          fi
